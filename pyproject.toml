[project]
name = "basic-dockerized-pipeline"
version = "0.1.0"
description = "A containerized CLI pipeline to ingest, clean, and publish CSV/Parquet datasets into PostgreSQL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7",
    "pandas>=2.2.0",
    "psycopg2-binary>=2.9.9",
    "pyarrow>=18.0.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.0",
    "tqdm>=4.66.0",
]

[project.scripts]
pipeline = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
