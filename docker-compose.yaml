services:
  pg-database:
    image: postgres:17
    container_name: pg-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-0000}"
      POSTGRES_DB: ${POSTGRES_DB:-dockerized_pipeline_database}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-dockerized_pipeline_database}"]
      interval: 3s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: "0000"
    ports:
      - "8080:80"
    depends_on:
      pg-database:
        condition: service_healthy

volumes:
  pg_data: